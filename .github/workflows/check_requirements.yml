name: Check requirements.txt is in sync

on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - requirements.txt
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - requirements.txt

jobs:
  check-requirements:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Regenerate requirements.txt
        run: uv export --no-hashes --no-dev -o requirements.txt.generated

      - name: Fail if requirements.txt is stale
        run: |
          if ! diff -q requirements.txt requirements.txt.generated > /dev/null; then
            echo "::error::requirements.txt is out of sync with uv.lock. Run 'uv export --no-hashes --no-dev -o requirements.txt' and commit the result."
            diff requirements.txt requirements.txt.generated || true
            exit 1
          fi
